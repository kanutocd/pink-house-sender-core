plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/MethodLength:
  Exclude:
    - "test/sender/test_message.rb"
    - "test/sender/**/*.rb"
    - "lib/sender/core/http.rb"
    - "lib/sender/core/router.rb"
    - "lib/sender/core/delivery.rb"
    - "lib/sender/core/state_store.rb"
    - "lib/sender/core/health.rb"

Metrics/AbcSize:
  Exclude:
    - "test/sender/**/*.rb"
    - "lib/sender/core/http.rb"
    - "lib/sender/core/router.rb"
    - "lib/sender/core/delivery.rb"
    - "lib/sender/core/state_store.rb"
    - "lib/sender/core/health.rb"

Metrics/ParameterLists:
  Exclude:
    - "lib/sender/core/delivery.rb"
    - "lib/sender/core/delivery_event.rb"
    - "lib/sender/core/http.rb"

Metrics/CyclomaticComplexity:
  Exclude:
    - "lib/sender/core/router.rb"
    - "lib/sender/core/state_store.rb"
    - "test/sender/**/*.rb"
    - "lib/sender/core/health.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "lib/sender/core/router.rb"
    - "lib/sender/core/state_store.rb"
    - "lib/sender/core/health.rb"

Metrics/BlockLength:
  Exclude:
    - "lib/sender/core/router.rb"
    - "sender-core.gemspec"

Metrics/ClassLength:
  Exclude:
    - "test/sender/**/*.rb"
    - "lib/sender/core/router.rb"
